[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = ["pip install -r requirements.txt && pip install aiosqlite email-validator python-socketio prometheus-fastapi-instrumentator && pip install -e ../../packages/sandbox -e ../../packages/agents || pip install -e ./packages/sandbox -e ./packages/agents || true"]

[phases.build]
cmds = ["echo 'No build needed for Python API'"]

[start]
cmd = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8001} --workers 2'"

[variables]
PYTHONUNBUFFERED = "1"
