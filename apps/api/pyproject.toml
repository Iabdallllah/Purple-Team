[project]
name = "purple-api"
version = "0.0.0"
description = "Purple Platform API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "T20", "ARG", "SIM", "RUF", "PLR", "PLE", "PD", "PGH", "PIE", "TID", "TRY", "NPY", "RSE", "RET", "FLY", "PTH", "ERA", "EXE", "ISC", "ICN", "LOG", "G", "INT", "PL", "Q", "TD", "TCH", "PT"]
ignore = ["E501", "ARG001", "ARG002", "PLR0913", "PLR0917"]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]