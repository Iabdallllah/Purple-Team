[project]
name = "purple-sandbox"
version = "0.0.0"
description = "Purple Platform Sandbox"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
