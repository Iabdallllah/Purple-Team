services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: purple-postgres
    environment:
      POSTGRES_DB: purple
      POSTGRES_USER: purple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purple}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purple -d purple"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purple-network

  redis:
    image: redis:7-alpine
    container_name: purple-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purple-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: purple-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      CHROMA_SERVER_CORS_ALLOW_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - purple-network

  ollama:
    image: ollama/ollama:latest
    container_name: purple-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - purple-network

