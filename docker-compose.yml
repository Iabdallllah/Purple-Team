  #     timeout: 10s
  #     retries: 5
  #   networks:
  #     - purple-network

  # Target Applications (for testing)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: purple-juice-shop
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: unsafe
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - purple-network
    profiles:
      - targets

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: purple-dvwa
    ports:
      - "3002:80"
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: dvwa
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/setup.php"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - purple-network
    profiles:
      - targets

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  # neo4j_data:
  # neo4j_logs:

networks:
  purple-network:
    driver: bridge